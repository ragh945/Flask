<!DOCTYPE html>
<html>
<head>
    <title>Success If Score</title>
</head>
<body>
    {% if result >= 50 %}
        <h1>Based on the marks you have {{ result }}</h1>
        <h2>Congratulations! You have passed the exam.</h2>
    {% else %}
        <h1>Based on the marks you have {{ result }}</h1>
        <h2>Sorry! You have failed the exam.</h2>
    {% endif %}

    <h3>Score: {{ result }}</h3>
</body>
</html>
